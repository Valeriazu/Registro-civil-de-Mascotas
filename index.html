<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Civil de Mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<body style="background-color: #e2d2d2;"></body>
    <div class="text-white text-center py-4 mb-5 shadow-sm" style="background-color: #1a3f7a;"></div>
        <h1 class="text-center mb-4 text-primary display-5 text-black" style="letter-spacing: 4px;">🇨🇱 Ministerio de las Mascotas 🐾</h1>
        <h4 class="text-center text-muted mb-5">Registro Civil de Mascotas</h4>
            </div>
        <div id="alertContainer"></div>

        <div class="row g-4">
            <div class="col-md-5">
                <div class="card shadow-sm p-4">
                    <h5 class="card-title mb-3 text-secondary">Registrar Mascota</h5>
                    <form id="mascotaForm">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Mascota</label>
                            <input type="text" class="form-control" id="nombre" required placeholder="Ej: Firulais">
                        </div>
                        <div class="mb-3">
                            <label for="rut" class="form-label">RUT Dueño</label>
                            <input type="text" class="form-control" id="rut" required placeholder="Ej: 12345678-9">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Agregar Mascota</button>
                    </form>
                </div>
            </div>

            <div class="col-md-7">
                <div class="card shadow-sm p-4">
                    <h5 class="card-title mb-3 text-secondary">Filtros de Búsqueda</h5>
                    <div class="input-group mb-3">
                        <input type="text" id="buscarInput" class="form-control" placeholder="Nombre o RUT...">
                        <button class="btn btn-outline-primary" type="button" onclick="obtenerMascotas('nombre')">Por Nombre</button>
                        <button class="btn btn-outline-primary" type="button" onclick="obtenerMascotas('rut')">Por RUT</button>
                        <button class="btn btn-secondary" type="button" onclick="obtenerMascotas('todas')">Limpiar</button>
                    </div>

                    <h5 class="card-title mt-4 mb-3 text-secondary">Mascotas Registradas</h5>
                    <ul class="list-group" id="listaMascotas">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <script>
        const API_URL = 'http://localhost:4200/mascotas';

        // --- FUNCIÓN PARA MANEJAR Y MOSTRAR ERRORES (Requisito de la rúbrica) ---
        function mostrarMensaje(mensaje, tipo = 'danger') {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${tipo} alert-dismissible fade show" role="alert">
                    ${mensaje}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            // Auto-eliminar la alerta a los 4 segundos
            setTimeout(() => { container.innerHTML = ''; }, 4000);
        }

        // --- CAPA DE CONSUMO (GET) ---
        async function obtenerMascotas(tipoFiltro = 'todas') {
            const input = document.getElementById('buscarInput').value.trim();
            let url = API_URL;

            if (tipoFiltro === 'nombre' && input) url += `?nombre=${input}`;
            if (tipoFiltro === 'rut' && input) url += `?rut=${input}`;

            try {
                const respuesta = await axios.get(url);
                const lista = document.getElementById('listaMascotas');
                lista.innerHTML = '';

                // Axios maneja los datos en .data
                let datos = respuesta.data;
                
                // Si es un GET por nombre, el backend devuelve un objeto único, lo metemos en un array para que el forEach no falle
                if (!Array.isArray(datos)) datos = datos ? [datos] : [];

                if (datos.length === 0) {
                    lista.innerHTML = '<li class="list-group-item text-muted italic text-center">No hay mascotas registradas</li>';
                    return;
                }

                datos.forEach(mascota => {
                    lista.innerHTML += `
                        <li class="list-group-item d-flex justify-between align-items-center d-flex justify-content-between">
                            <div>
                                <strong>🐾 ${mascota.nombre}</strong> <br>
                                <small class="text-muted">Dueño (RUT): ${mascota.rut}</small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-danger me-1" onclick="eliminarMascota('nombre', '${mascota.nombre}')">Borrar por Nombre</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="eliminarMascota('rut', '${mascota.rut}')">Borrar Todo el RUT</button>
                            </div>
                        </li>
                    `;
                });
            } catch (error) {
                // Manejo de errores adecuado
                if (error.response && error.response.status === 404) {
                    mostrarMensaje("No se encontraron resultados para la búsqueda.", "warning");
                    document.getElementById('listaMascotas').innerHTML = '';
                } else {
                    mostrarMensaje("Error al conectar con el servidor. ¿Está el backend encendido?");
                    console.error("Detalle del error:", error);
                }
            }
        }

        // --- CAPA DE ALIMENTACIÓN (POST) ---
        document.getElementById('mascotaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const rut = document.getElementById('rut').value.trim();

            try {
                await axios.post(API_URL, { nombre, rut });
                mostrarMensaje("¡Mascota registrada con éxito!", "success");
                document.getElementById('mascotaForm').reset();
                obtenerMascotas(); // Recargar la lista
            } catch (error) {
                mostrarMensaje("Error al registrar la mascota. Revisa los datos enviados.");
                console.error("Detalle del error:", error);
            }
        });

        // --- CAPA DE ELIMINACIÓN (DELETE) ---
        async function eliminarMascota(tipo, valor) {
            if (!confirm(`¿Estás seguro de que deseas eliminar por ${tipo}?`)) return;

            try {
                await axios.delete(`${API_URL}?${tipo}=${valor}`);
                mostrarMensaje(`Eliminación exitosa (${tipo}: ${valor})`, "success");
                obtenerMascotas(); // Recargar la lista
            } catch (error) {
                mostrarMensaje("Ocurrió un error al intentar eliminar el registro.");
                console.error("Detalle del error:", error);
            }
        }

        // Cargar todas las mascotas apenas abre la página
        obtenerMascotas();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
